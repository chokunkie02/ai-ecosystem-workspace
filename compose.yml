services:
  # MinIO S3-Compatible Object Storage Container
  minio:
    image: minio/minio:latest
    container_name: ai_minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ai_ecosystem_net

  # Redis In-Memory Data Store & Cache Container
  redis:
    image: redis:7-alpine
    container_name: ai_redis
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel notice
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ai_ecosystem_net

  # Label Studio Data Annotation Platform Container
  label_studio:
    image: heartexlabs/label-studio:latest
    container_name: ai_label_studio
    ports:
      - "8080:8080"
    environment:
      LABEL_STUDIO_LOCAL_FILES_SERVING_ENABLED: "true"
      LABEL_STUDIO_DISABLE_SIGNUP_WITHOUT_LINK: "true"
      LABEL_STUDIO_USERNAME: "admin@example.com"
      LABEL_STUDIO_PASSWORD: "adminpassword"
    volumes:
      - label_studio_data:/label-studio/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - ai_ecosystem_net

  # PostgreSQL Database Container
  postgres:
    image: postgres:16-alpine
    container_name: ai_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_ecosystem
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ai_ecosystem_net

  # MLflow Tracking Server Container
  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: ai_mlflow
    command: mlflow server --backend-store-uri postgresql://postgres:postgres@postgres:5432/ai_ecosystem --default-artifact-root s3://mlflow --host 0.0.0.0 --port 5000 --allowed-hosts "*" --cors-allowed-origins "*"
    ports:
      - "5000:5000"
    environment:
      - MLFLOW_BACKEND_STORE_URI=postgresql://postgres:postgres@postgres:5432/ai_ecosystem
      - MLFLOW_DEFAULT_ARTIFACT_ROOT=s3://mlflow
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
      - MLFLOW_S3_IGNORE_TLS=true
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:5000/health\")' || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ai_ecosystem_net
    restart: always

  # FastAPI App Service
  fastapi:
    build:
      context: ./fastapi_app
      dockerfile: Dockerfile
    container_name: ai_fastapi
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      mlflow:
        condition: service_started
    networks:
      - ai_ecosystem_net
    restart: always

  # Trainer Worker Service (GPU)
  trainer_worker:
    build:
      context: ./trainer_worker
      dockerfile: Dockerfile
    container_name: ai_trainer_worker
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
      - MLFLOW_S3_IGNORE_TLS=true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      mlflow:
        condition: service_started
    networks:
      - ai_ecosystem_net
    restart: always

  # Inference Worker Service
  inference_worker:
    build:
      context: ./inference_worker
      dockerfile: Dockerfile
    container_name: ai_inference_worker
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
      - MLFLOW_S3_IGNORE_TLS=true
      - MODEL_NAME=bert-ner
      - MODEL_STAGE=None
    depends_on:
      redis:
        condition: service_healthy
      mlflow:
        condition: service_started
    networks:
      - ai_ecosystem_net
    restart: always

volumes:
  minio_data:
    driver: local
  redis_data:
    driver: local
  label_studio_data:
    driver: local
  postgres_data:
    driver: local

networks:
  ai_ecosystem_net:
    driver: bridge
